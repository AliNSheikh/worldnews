name: Hourly News Discover Ingest

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-news-discover-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected crawler
        env:
          SITE_URL: ${{ secrets.NEWS_DISCOVER_URL || 'https://worldnews-topaz.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET GitHub Actions secret is required."
            exit 1
          fi

          BASE_URL="${SITE_URL%/}"
          curl --fail-with-body --retry 2 --retry-delay 10 \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/hourly"
