name: Hourly News Ingestion

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger World News ingestion
        env:
          APP_URL: ${{ secrets.WORLDNEWS_APP_URL }}
          CRON_SECRET: ${{ secrets.WORLDNEWS_CRON_SECRET }}
        run: |
          test -n "$APP_URL" || (echo "Missing WORLDNEWS_APP_URL secret" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing WORLDNEWS_CRON_SECRET secret" && exit 1)
          curl --fail-with-body --retry 2 --retry-delay 10 \
            -X POST "${APP_URL%/}/api/crawler/run-now" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
