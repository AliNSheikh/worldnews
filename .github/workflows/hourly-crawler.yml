name: Hourly News Discover Crawler

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-discover-hourly-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate scheduler configuration
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Repository variable NEWS_DISCOVER_URL is not configured."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not configured."
            exit 1
          fi

      - name: Run protected hourly crawler
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SITE_URL="${SITE_URL%/}"
          response_file="$(mktemp)"
          status="$(
            curl               --silent               --show-error               --location               --max-time 300               --output "$response_file"               --write-out "%{http_code}"               --header "Authorization: Bearer $CRON_SECRET"               --header "Accept: application/json"               "$SITE_URL/api/cron/hourly"
          )"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Hourly crawler returned HTTP $status"
            exit 1
          fi
