name: Hourly News Discover Crawler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-discover-hourly-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger protected hourly crawler
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not configured."
            exit 1
          fi

          SITE_URL="${SITE_URL%/}"
          curl             --fail-with-body             --silent             --show-error             --location             --retry 2             --retry-delay 10             --max-time 300             --header "Authorization: Bearer $CRON_SECRET"             --header "Accept: application/json"             "$SITE_URL/api/cron/hourly"
