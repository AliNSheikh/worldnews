name: Hourly News Discover Crawler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-discover-hourly-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly crawler
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not configured."
            exit 1
          fi

          SITE_URL="${SITE_URL%/}"
          RESPONSE_FILE="$(mktemp)"

          HTTP_CODE="$(curl             --silent             --show-error             --location             --retry 2             --retry-delay 10             --max-time 300             --output "$RESPONSE_FILE"             --write-out "%{http_code}"             --header "Authorization: Bearer $CRON_SECRET"             --header "Accept: application/json"             "$SITE_URL/api/cron/hourly")"

          cat "$RESPONSE_FILE"
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Hourly crawler returned HTTP $HTTP_CODE."
            exit 1
          fi

          python - "$RESPONSE_FILE" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          if payload.get("success") is False:
              raise SystemExit("Crawler returned success=false")

          imported = payload.get("newArticlesCount", payload.get("count", 0))
          message = payload.get("message", "Crawler completed.")
          print(f"Hourly crawler success. Imported: {imported}. {message}")
          PY

      - name: Verify new content is readable from site
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"

          curl             --fail-with-body             --silent             --show-error             --location             --retry 2             --retry-delay 5             --max-time 60             "$SITE_URL/api/articles?status=published&limit=1&offset=0&sort=newest"             >/tmp/latest-article.json

          python - /tmp/latest-article.json <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              payload = json.load(fh)
          if not isinstance(payload, list):
              raise SystemExit("Published article endpoint did not return a list.")
          print(f"Published article endpoint is healthy. Returned {len(payload)} item(s).")
          PY

      - name: Refresh sitemap endpoint
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          curl             --fail-with-body             --silent             --show-error             --location             --retry 2             --retry-delay 5             --max-time 60             --header "Cache-Control: no-cache"             "$SITE_URL/sitemap.xml"             >/tmp/sitemap.xml

          grep -q "<sitemapindex" /tmp/sitemap.xml
          echo "Sitemap endpoint is healthy."
