name: Hourly News Discover Crawler

on:
  schedule:
    # Three watchdog triggers per hour; the API guard allows only one real crawl per ~hour.
    # Non-zero minutes avoid the busiest GitHub Actions scheduling window.
    - cron: "11,31,51 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: news-discover-hourly-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly crawler with GitHub OIDC
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
        run: |
          set -euo pipefail

          SITE_URL="${SITE_URL%/}"
          RESPONSE_FILE="$(mktemp)"
          OIDC_FILE="$(mktemp)"

          curl             --fail-with-body             --silent             --show-error             --location             --max-time 30             --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=newsdiscover.org"             > "$OIDC_FILE"

          OIDC_TOKEN="$(python - "$OIDC_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              payload = json.load(fh)
          token = payload.get("value")
          if not token:
              raise SystemExit("GitHub did not return an OIDC token.")
          print(token)
          PY
          )"

          HTTP_CODE="$(curl             --silent             --show-error             --location             --retry 2             --retry-delay 10             --max-time 300             --output "$RESPONSE_FILE"             --write-out "%{http_code}"             --header "Authorization: Bearer $OIDC_TOKEN"             --header "X-NewsDiscover-Scheduler: github-actions"             --header "Accept: application/json"             "$SITE_URL/api/cron/hourly")"

          cat "$RESPONSE_FILE"
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Hourly crawler returned HTTP $HTTP_CODE."
            exit 1
          fi

          python - "$RESPONSE_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          if payload.get("success") is False:
              raise SystemExit("Crawler returned success=false")

          imported = payload.get("newArticlesCount", payload.get("count", 0))
          message = payload.get("message", "Crawler completed.")
          print(f"Hourly crawler success. Imported: {imported}. {message}")
          PY

      - name: Verify published articles API
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"

          curl             --fail-with-body             --silent             --show-error             --location             --retry 2             --retry-delay 5             --max-time 60             "$SITE_URL/api/articles?status=published&limit=1&offset=0&sort=newest"             > /tmp/latest-article.json

          python - /tmp/latest-article.json <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              payload = json.load(fh)
          if not isinstance(payload, list):
              raise SystemExit("Published article endpoint did not return a list.")
          print(f"Published article endpoint is healthy. Returned {len(payload)} item(s).")
          PY

      - name: Verify sitemap
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"

          curl             --fail-with-body             --silent             --show-error             --location             --retry 2             --retry-delay 5             --max-time 60             --header "Cache-Control: no-cache"             "$SITE_URL/sitemap.xml"             > /tmp/sitemap.xml

          grep -q "<sitemapindex" /tmp/sitemap.xml
          echo "Sitemap endpoint is healthy."
