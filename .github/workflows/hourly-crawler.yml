name: Hourly News Discover Crawler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-discover-hourly-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Drain all unseen feed items
        env:
          SITE_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not configured."
            exit 1
          fi

          SITE_URL="${SITE_URL%/}"
          total=0
          cycles=0
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          while true; do
            cycles=$((cycles + 1))
            response_file="$(mktemp)"
            status="$(
              curl                 --silent                 --show-error                 --location                 --max-time 300                 --output "$response_file"                 --write-out "%{http_code}"                 --header "Authorization: Bearer $CRON_SECRET"                 --header "Accept: application/json"                 "$SITE_URL/api/cron/hourly?batch=30"
            )"

            cat "$response_file"
            echo

            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Hourly crawler returned HTTP $status"
              exit 1
            fi

            imported="$(jq -r '.newArticlesCount // .count // 0' "$response_file")"
            has_more="$(jq -r '.hasMore // false' "$response_file")"
            total=$((total + imported))

            echo "cycle=$cycles imported=$imported total=$total hasMore=$has_more"

            if [ "$has_more" != "true" ]; then
              break
            fi

            sleep 2
          done

          summary_file="$(mktemp)"
          curl             --silent             --show-error             --location             --max-time 120             --output "$summary_file"             --header "Authorization: Bearer $CRON_SECRET"             --header "Accept: application/json"             --get             --data-urlencode "summary=1"             --data-urlencode "count=$total"             --data-urlencode "cycles=$cycles"             --data-urlencode "hasMore=false"             --data-urlencode "startedAt=$started_at"             "$SITE_URL/api/cron/hourly"
          cat "$summary_file"
          echo

          echo "Hourly drain complete: $total article(s) across $cycles batch(es)."
