name: Daily Bulk Search Indexing

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-discover-daily-bulk-indexing
  cancel-in-progress: false

jobs:
  bulk-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run bulk indexing
        env:
          APP_URL: ${{ vars.NEWS_DISCOVER_URL || 'https://www.newsdiscover.org' }}
          GOOGLE_INDEXING_CLIENT_EMAIL: ${{ secrets.GOOGLE_INDEXING_CLIENT_EMAIL }}
          GOOGLE_INDEXING_PRIVATE_KEY: ${{ secrets.GOOGLE_INDEXING_PRIVATE_KEY }}
        run: node scripts/bulk-index.mjs

      - name: Persist indexing progress
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f scripts/indexing-state.json ]; then
            echo "No indexing state file found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/indexing-state.json

          if git diff --cached --quiet; then
            echo "No indexing state changes to commit."
            exit 0
          fi

          git commit -m "Update bulk indexing state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
